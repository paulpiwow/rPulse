spring.application.name=rpulse-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:live}
server.port=8080

# Datasource — overridden by env vars in Docker Compose.
# Defaults to a local file-less H2 DB so the app boots without Postgres.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:rpulse;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway owns the schema now, so Hibernate must not create/alter tables.
# 'validate' = check entities match the Flyway-built schema (if/when you add entities).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway runs migrations from classpath:db/migration on startup (V1__, V2__, ...).
spring.flyway.enabled=true

# InfluxDB 3 connector. The destination is switchable between two modes that share the
# same database/measurement names, so queries are identical against either:
#   local mode (default) — rPulse's own rpulse-influx container; self-contained demo.
#   rTruth mode          — rTruth's Influx, host-published on 8087.
# Docker Compose overrides the URL per mode (see .env.local-influx / .env.rtruth at the
# repo root); the default below is for running the backend directly on the host, where
# rpulse-influx is published on 8188 (rTruth mode on the host: http://127.0.0.1:8087).
rpulse.influx.url=${RPULSE_INFLUX_URL:http://127.0.0.1:8188}
rpulse.influx.database=${RPULSE_INFLUX_DATABASE:skid_bucket}
rpulse.influx.raw-measurement=${RPULSE_INFLUX_RAW_MEASUREMENT:skid_measurement}
rpulse.influx.ctag-measurement=${RPULSE_INFLUX_CTAG_MEASUREMENT:skid_computedTag_measurement}
rpulse.influx.token=${RPULSE_INFLUX_TOKEN:}
rpulse.influx.connect-timeout=${RPULSE_INFLUX_CONNECT_TIMEOUT:3s}
rpulse.influx.read-timeout=${RPULSE_INFLUX_READ_TIMEOUT:10s}

# Stage-1 upstream source and rPulse's private destination are deliberately separate
# connections. Like rpulse.influx.url above, the source defaults to the local
# sim-fed Influx (host-published 8188) so the stack runs standalone; point it at
# the real rTruth with RPULSE_RTRUTH_URL (http://127.0.0.1:8087 on the host).
rpulse.rtruth.url=${RPULSE_RTRUTH_URL:http://127.0.0.1:8188}
rpulse.rtruth.database=${RPULSE_RTRUTH_DATABASE:skid_bucket}
rpulse.rtruth.raw-measurement=${RPULSE_RTRUTH_RAW_MEASUREMENT:skid_measurement}
rpulse.rtruth.ctag-measurement=${RPULSE_RTRUTH_CTAG_MEASUREMENT:skid_computedTag_measurement}
rpulse.rtruth.token=${RPULSE_RTRUTH_TOKEN:}
rpulse.rtruth.org=${RPULSE_RTRUTH_ORG:rhobot}
rpulse.rtruth.connect-timeout=${RPULSE_RTRUTH_CONNECT_TIMEOUT:3s}
rpulse.rtruth.read-timeout=${RPULSE_RTRUTH_READ_TIMEOUT:10s}

rpulse.local-influx.url=${RPULSE_LOCAL_INFLUX_URL:http://127.0.0.1:8188}
rpulse.local-influx.database=${RPULSE_LOCAL_INFLUX_DATABASE:skid_bucket}
rpulse.local-influx.raw-measurement=${RPULSE_LOCAL_INFLUX_RAW_MEASUREMENT:skid_measurement}
rpulse.local-influx.ctag-measurement=${RPULSE_LOCAL_INFLUX_CTAG_MEASUREMENT:skid_computedTag_measurement}
rpulse.local-influx.token=${RPULSE_LOCAL_INFLUX_TOKEN:}
rpulse.local-influx.org=${RPULSE_LOCAL_INFLUX_ORG:rpulse}
rpulse.local-influx.connect-timeout=${RPULSE_LOCAL_INFLUX_CONNECT_TIMEOUT:3s}
rpulse.local-influx.read-timeout=${RPULSE_LOCAL_INFLUX_READ_TIMEOUT:10s}

rpulse.stage1.interval-ms=${RPULSE_STAGE1_INTERVAL_MS:10000}
rpulse.stage1.initial-delay-ms=${RPULSE_STAGE1_INITIAL_DELAY_MS:10000}
rpulse.stage1.rolling-window=${RPULSE_STAGE1_ROLLING_WINDOW:PT15M}
rpulse.stage1.ctag-destination=${RPULSE_STAGE1_CTAG_DESTINATION:local}

# Alarm engine — how often the scheduled Stage-2 evaluation runs (milliseconds), ~10s. The
# Operate endpoints also evaluate inline on demand; this only paces the background job.
rpulse.alarm.evaluate-interval-ms=${RPULSE_ALARM_EVALUATE_INTERVAL_MS:10000}
rpulse.alarm.initial-delay-ms=${RPULSE_ALARM_INITIAL_DELAY_MS:10000}

# Maintenance-warning engine — the Stage-2 sibling of the alarm engine. It watches each
# enabled baseline and fires a warning when a tag drifts outside its normal range. This is a
# separate idea from alarms: alarms come from user rules, warnings come from baseline drift.
# How often the background evaluation runs (milliseconds), ~10s.
rpulse.maintenance.evaluate-interval-ms=${RPULSE_MAINTENANCE_EVALUATE_INTERVAL_MS:10000}
# How many standard deviations from the baseline average still counts as normal — the N in
# "mean plus or minus N standard deviations". 3 is the usual "three-sigma" choice.
rpulse.maintenance.std-dev-multiplier=${RPULSE_MAINTENANCE_STD_DEV_MULTIPLIER:3}
# Which bounds a drift is measured against: RANGE (low/high only), STDDEV (mean +/- N*std
# only), or EITHER (both). Defaults to EITHER so nothing abnormal slips through.
rpulse.maintenance.mode=${RPULSE_MAINTENANCE_MODE:EITHER}

# Actuator — expose health/info for container healthchecks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
