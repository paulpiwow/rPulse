services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rpulse
      POSTGRES_USER: rpulse
      POSTGRES_PASSWORD: rpulse
    ports:
      - "5544:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpulse -d rpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8456:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rpulse
      SPRING_DATASOURCE_USERNAME: rpulse
      SPRING_DATASOURCE_PASSWORD: rpulse
      # Influx destination is switchable between two modes (same skid_bucket name and
      # measurements in both, so backend queries are identical either way):
      #   local mode (default) — rPulse's own rpulse-influx service; standalone demo.
      #   rTruth mode          — rTruth's Influx on the host; run with
      #                          `docker compose --env-file .env.rtruth up`.
      RPULSE_INFLUX_URL: ${RPULSE_INFLUX_URL:-http://rpulse-influx:8181}
      RPULSE_INFLUX_DATABASE: ${RPULSE_INFLUX_DATABASE:-skid_bucket}
      RPULSE_INFLUX_TOKEN: ${RPULSE_INFLUX_TOKEN:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      RPULSE_RTRUTH_URL: ${RPULSE_RTRUTH_URL:-http://host.docker.internal:8087}
      RPULSE_RTRUTH_DATABASE: ${RPULSE_RTRUTH_DATABASE:-skid_bucket}
      RPULSE_RTRUTH_MEASUREMENT: ${RPULSE_RTRUTH_MEASUREMENT:-skid_measurement}
      RPULSE_RTRUTH_TOKEN: ${RPULSE_RTRUTH_TOKEN:-}
      RPULSE_LOCAL_INFLUX_URL: ${RPULSE_LOCAL_INFLUX_URL:-http://rpulse-influx:8181}
      RPULSE_LOCAL_INFLUX_DATABASE: ${RPULSE_LOCAL_INFLUX_DATABASE:-rpulse_bucket}
      RPULSE_LOCAL_INFLUX_MEASUREMENT: ${RPULSE_LOCAL_INFLUX_MEASUREMENT:-stage1_measurement}
      # Dev: read migrations from the bind-mount below instead of the ones baked
      # into the image, so editing SQL only needs a container restart, no rebuild.
      SPRING_FLYWAY_LOCATIONS: filesystem:/migrations
    volumes:
      - ./backend/src/main/resources/db/migration:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
      rpulse-influx:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 10s
      timeout: 5s
      retries: 5

  # rPulse's own time-series database, separate from rTruth's. Before this,
  # the backend borrowed rTruth's Influx over host.docker.internal:8087;
  # now rPulse is a self-contained stack with its own Influx (per design).
  rpulse-influx:
    image: influxdb:3.10.0-core
    # Local dev only: --without-auth means no token is needed, and databases
    # are created automatically the first time something writes to them.
    command: [influxdb3, serve, --without-auth]
    # Host 8188 lets you poke at it from your laptop; inside the compose
    # network the backend reaches it as rpulse-influx:8181 (see backend env).
    # 8188 avoids clashing with rTruth (8087) and rhobot (8086) on the host.
    ports:
      - "8188:8181"
    environment:
      INFLUXDB3_NODE_IDENTIFIER_PREFIX: rpulse
      INFLUXDB3_OBJECT_STORE: file
      INFLUXDB3_DB_DIR: /var/lib/influxdb3
    volumes:
      - rpulse-influx-data:/var/lib/influxdb3

  # Skid simulator — stands in for the real compressor skid, publishing raw tag
  # values into skid_bucket/skid_measurement on whichever Influx the mode env
  # selects (same presets as the backend: local rpulse-influx by default,
  # rTruth via `--env-file .env.rtruth`). Raw tags only; CTags are computed
  # downstream by the backend. Disable with `--scale skid-sim=0`.
  skid-sim:
    build:
      context: ./simulator
    environment:
      RPULSE_INFLUX_URL: ${RPULSE_INFLUX_URL:-http://rpulse-influx:8181}
      RPULSE_INFLUX_DATABASE: ${RPULSE_INFLUX_DATABASE:-skid_bucket}
      RPULSE_INFLUX_RAW_MEASUREMENT: ${RPULSE_INFLUX_RAW_MEASUREMENT:-skid_measurement}
      RPULSE_INFLUX_TOKEN: ${RPULSE_INFLUX_TOKEN:-}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-5}
      # Trailing window of history backfilled on startup (rolling: restarts
      # only fill the gap since the last written point). 0 disables.
      SIM_BACKFILL_DAYS: ${SIM_BACKFILL_DAYS:-7}
      SIM_BACKFILL_INTERVAL_SECONDS: ${SIM_BACKFILL_INTERVAL_SECONDS:-60}
    depends_on:
      rpulse-influx:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  db-data:
  rpulse-influx-data:
